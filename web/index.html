<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Puzzle #71 Pool</title>
<style>
  :root {
    --bg:#07080c; --card:#12141c; --line:#1e2330; --text:#e8edf7; --muted:#8b93a7;
    --gold:#f5b942; --cyan:#3ee0c6; --green:#5ee9a0; --red:#ff6b6b;
  }
  *{box-sizing:border-box}
  body{margin:0;font-family:"Segoe UI",system-ui,sans-serif;color:var(--text);
    background:radial-gradient(900px 400px at 0 0,#1a1408,transparent),var(--bg)}
  .wrap{max-width:1100px;margin:0 auto;padding:24px 16px 48px}
  h1{margin:0;font-size:26px} h1 span{color:var(--gold)}
  .sub{color:var(--muted);margin-top:6px;font-size:14px}
  .hero{margin-top:20px;background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px}
  label{display:block;color:var(--muted);font-size:11px;text-transform:uppercase;letter-spacing:.08em;margin-bottom:6px}
  input,select{width:100%;padding:10px 12px;border-radius:10px;border:1px solid var(--line);
    background:#0b0d12;color:var(--text);font-size:14px}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:12px}
  @media(max-width:700px){.row{grid-template-columns:1fr}}
  .btns{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
  button{padding:10px 16px;border-radius:10px;border:1px solid var(--cyan);background:#1a2430;
    color:var(--cyan);font-weight:700;cursor:pointer}
  button.primary{background:linear-gradient(90deg,#c98a1a,var(--gold));color:#111;border-color:var(--gold)}
  button:disabled{opacity:.45;cursor:not-allowed}
  .cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px;margin-top:18px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:12px 14px}
  .card b{font-size:17px;display:block;margin-top:4px}
  #mapCanvas{width:100%;max-width:520px;image-rendering:pixelated;border:1px solid var(--line);
    border-radius:8px;background:#131722;display:block;margin-top:10px}
  .tip{margin-top:8px;font-size:12px;color:var(--muted);font-family:Consolas,monospace;word-break:break-all}
  .legend{font-size:12px;color:var(--muted);margin-top:8px}
  .workers{margin-top:16px;font-size:13px;color:var(--muted)}
  .found{background:#2a2010;border:1px solid var(--gold);border-radius:12px;padding:14px;margin-top:16px;color:var(--gold)}
  code{color:var(--cyan)}
</style>
</head>
<body>
<div class="wrap">
  <h1>Bitcoin Puzzle <span>#71</span> Pool</h1>
  <div class="sub">Wspólna mapa · lokalne GPU/CPU · 3 BTC dla znalazcy, reszta na skarbiec</div>

  <div class="hero">
    <div class="row">
      <div>
        <label>Twój adres BTC (wypłata przy trafieniu)</label>
        <input id="payout" placeholder="bc1q... lub 1...">
      </div>
      <div>
        <label>Tryb liczenia (lokalnie)</label>
        <select id="mode">
          <option value="gpu">GPU / CUDA (szybko)</option>
          <option value="cpu">CPU (wolniej, bez karty)</option>
        </select>
      </div>
    </div>
    <div class="row">
      <div>
        <label>Nick</label>
        <input id="nick" placeholder="np. Kuba-RTX5080">
      </div>
      <div>
        <label>URL serwera (zostaw jeśli lokalnie)</label>
        <input id="serverUrl" value="">
      </div>
    </div>
    <div class="btns">
      <button class="primary" id="btnStart">Start — weź kolejny kawałek</button>
      <button id="btnWorker">Kopiuj komendę workera</button>
    </div>
    <div class="tip" id="workerCmd">Worker: <code>python worker.py http://127.0.0.1:8780 bc1... gpu</code></div>
  </div>

  <div class="cards">
    <div class="card"><label>Postęp puli</label><b id="pct">0%</b></div>
    <div class="card"><label>Kwadraciki done</label><b id="done">0</b></div>
    <div class="card"><label>Aktywne</label><b id="active">0</b></div>
    <div class="card"><label>Wolne</label><b id="free">0</b></div>
    <div class="card"><label>Nagroda znalazcy</label><b id="reward">3 BTC</b></div>
    <div class="card"><label>Skarbiec</label><b id="treasury">—</b></div>
  </div>

  <div id="foundBox" class="found" hidden></div>

  <div class="grid-title" style="margin-top:22px;color:var(--muted);font-size:12px;text-transform:uppercase;letter-spacing:.1em">
    Mapa Puzzle #71 — kliknij wolny kwadracik
  </div>
  <canvas id="mapCanvas" width="50" height="50"></canvas>
  <div class="tip" id="mapTip">Najedź / kliknij kwadracik</div>
  <div class="legend">Ciemny=wolny · Niebieski=liczy ktoś · Zielony=przeszukany</div>

  <div class="workers" id="workers"></div>
</div>
<script>
const canvas = document.getElementById("mapCanvas");
const ctx = canvas.getContext("2d");
let statusData = null;
let MAP_SIDE = 50;
let MAP_BINS = 2500;
let workerId = localStorage.getItem("pool_worker_id") || ("w_" + Math.random().toString(36).slice(2, 10));
localStorage.setItem("pool_worker_id", workerId);

function apiBase() {
  const v = document.getElementById("serverUrl").value.trim();
  return v || window.location.origin;
}

async function api(path, data) {
  const opt = data ? {method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(data)} : {};
  const r = await fetch(apiBase() + path, opt);
  return r.json();
}

function drawMap(mapStatus) {
  ctx.fillStyle = "#131722";
  ctx.fillRect(0, 0, MAP_SIDE, MAP_SIDE);
  if (!mapStatus) return;
  for (let i = 0; i < mapStatus.length && i < MAP_BINS; i++) {
    const x = i % MAP_SIDE, y = Math.floor(i / MAP_SIDE);
    const s = mapStatus[i];
    ctx.fillStyle = s === 2 ? "#5ee9a0" : s === 1 ? "#3ee0c6" : "#1a1e28";
    ctx.fillRect(x, y, 1, 1);
  }
}

function binFromEvent(ev) {
  const r = canvas.getBoundingClientRect();
  const x = Math.min(MAP_SIDE-1, Math.max(0, Math.floor((ev.clientX-r.left)/r.width*MAP_SIDE)));
  const y = Math.min(MAP_SIDE-1, Math.max(0, Math.floor((ev.clientY-r.top)/r.height*MAP_SIDE)));
  return y*MAP_SIDE+x;
}

canvas.addEventListener("mousemove", ev => {
  if (!statusData) return;
  const id = binFromEvent(ev);
  const st = statusData.map_status[id];
  const names = ["wolny","aktywny","przeszukany"];
  document.getElementById("mapTip").textContent = `Kwadracik #${id} — ${names[st]||"?"}`;
});

canvas.addEventListener("click", async ev => {
  const payout = document.getElementById("payout").value.trim();
  if (!payout) { alert("Wpisz adres BTC"); return; }
  await api("/api/register", {
    worker_id: workerId,
    name: document.getElementById("nick").value.trim() || workerId,
    payout_address: payout,
    mode: document.getElementById("mode").value
  });
  const bin_id = binFromEvent(ev);
  const res = await api("/api/claim", {worker_id: workerId, bin_id});
  if (res.status === "ok") {
    alert(`Zarezerwowano kwadracik #${bin_id}\nUruchom worker lokalnie!`);
  } else {
    alert(res.error || res.message || JSON.stringify(res));
  }
  refresh();
});

document.getElementById("btnStart").onclick = async () => {
  const payout = document.getElementById("payout").value.trim();
  if (!payout) { alert("Wpisz adres BTC"); return; }
  await api("/api/register", {
    worker_id: workerId, name: document.getElementById("nick").value.trim() || workerId,
    payout_address: payout, mode: document.getElementById("mode").value
  });
  const res = await api("/api/claim", {worker_id: workerId});
  if (res.status === "ok") alert(`Batch #${res.bin_id} — uruchom worker lokalnie`);
  else alert(res.error || res.message || JSON.stringify(res));
  refresh();
};

document.getElementById("btnWorker").onclick = () => {
  const payout = document.getElementById("payout").value.trim() || "TWOJ_ADRES_BTC";
  const mode = document.getElementById("mode").value;
  const nick = document.getElementById("nick").value.trim() || "miner";
  const cmd = `python worker.py ${apiBase()} ${payout} ${mode} ${nick}`;
  navigator.clipboard.writeText(cmd);
  document.getElementById("workerCmd").innerHTML = "Skopiowano: <code>" + cmd + "</code>";
};

async function refresh() {
  try {
    statusData = await api("/api/status");
    MAP_SIDE = statusData.map_side || 50;
    MAP_BINS = statusData.map_bins || MAP_SIDE * MAP_SIDE;
    canvas.width = MAP_SIDE;
    canvas.height = MAP_SIDE;
    document.getElementById("pct").textContent = statusData.progress_pct.toFixed(4) + "%";
    document.getElementById("done").textContent = statusData.bins_done;
    document.getElementById("active").textContent = statusData.bins_active;
    document.getElementById("free").textContent = statusData.bins_free;
    document.getElementById("treasury").textContent = statusData.treasury_address;
    drawMap(statusData.map_status);
    const w = statusData.workers || [];
    document.getElementById("workers").innerHTML = w.length
      ? "<b>Top minerzy:</b><br>" + w.slice(0,10).map(x =>
          `${x.name} · ${x.mode} · ${x.keys_done} kluczy ${x.online?"🟢":""}`).join("<br>")
      : "";
    const fb = document.getElementById("foundBox");
    if (statusData.found) {
      fb.hidden = false;
      fb.innerHTML = `<b>ZNALEZIONO!</b><br>Klucz: ${statusData.found.privkey}<br>Wypłata: ${statusData.found.payout_address}`;
    }
  } catch(e) {}
}
refresh();
setInterval(refresh, 2000);
</script>
</body>
</html>
